name: Contract and API validation

on:
  push:
    branches:
      - research/initial-technical-audit
  pull_request:
    branches:
      - research/initial-technical-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-api.txt
      - name: Install test and API dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements-api.txt
      - name: Validate JSON Schema and contract examples
        run: python -m unittest discover -s tests/contracts -v
      - name: Test API health endpoints
        run: python -m unittest discover -s tests/api -v
      - name: Compile Python sources
        run: python -m compileall -q apps tests
      - name: Apply PostgreSQL migration and verify tenant isolation
        run: bash tests/db/verify_migration.sh
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web dependencies and build PWA
        working-directory: apps/web
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build API container
        run: docker build -f Dockerfile.api -t browser-council-api:ci .
      - name: Build web container
        run: docker build -f Dockerfile.web -t browser-council-web:ci .
      - name: Smoke test API container
        run: |
          docker run --rm -d --name browser-council-api -p 8000:8000 browser-council-api:ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health/live; then
              docker stop browser-council-api
              exit 0
            fi
            sleep 2
          done
          docker logs browser-council-api
          docker stop browser-council-api
          exit 1
